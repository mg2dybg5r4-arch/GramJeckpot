<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090713">
<meta name="description" content="GramJeckpot — твоя ретро-футуристическая игровая аркада.">
<title>GramJeckpot 2.0</title>
<style>
:root{
  --bg:#090713;--panel:#141125;--panel2:#1b1731;
  --purple:#a855f7;--cyan:#35eaff;--pink:#ff4fbd;
  --gold:#ffd76a;--green:#50ffc0;--text:#f7f3ff;
  --muted:#9c94b9;--border:rgba(174,145,255,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
  radial-gradient(ellipse at 10% 0%,rgba(112,49,208,.2),transparent 36%),
  radial-gradient(ellipse at 100% 35%,rgba(0,206,255,.09),transparent 30%),var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;overflow-x:hidden;padding-bottom:94px;
}
button{font:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
*{scrollbar-width:thin;scrollbar-color:#514176 transparent}
.app{width:min(100%,600px);margin:auto;padding:15px 15px 25px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
 width:45px;height:45px;border-radius:14px;display:grid;place-items:center;font-size:25px;
 background:linear-gradient(145deg,#742cff,#17132f 65%);border:1px solid #ad75ff;
 box-shadow:0 0 25px #8c36ff35,inset 0 0 15px #b48aff30;flex-shrink:0
}
.brand-name{font-weight:950;letter-spacing:-.7px;font-size:19px;line-height:1.1}
.brand-name span{color:var(--cyan)}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:5px}
.icon-btn{width:40px;height:40px;border-radius:13px;background:var(--panel);border:1px solid var(--border);font-size:17px;display:grid;place-items:center}
.hero{
 position:relative;overflow:hidden;padding:22px 20px 20px;border-radius:25px;
 background:linear-gradient(135deg,#25144a,#11152d 58%,#0c2634);
 border:1px solid #6d4b9e;box-shadow:0 12px 45px #0005,inset 0 0 45px #b34dff0b
}
.hero:before{content:"";position:absolute;width:210px;height:210px;right:-85px;top:-95px;border-radius:50%;border:1px solid #d0a1ff33;box-shadow:0 0 0 20px #d0a1ff09,0 0 0 40px #d0a1ff07}
.hero:after{content:"";position:absolute;width:110px;height:110px;right:17px;bottom:-80px;border-radius:50%;background:var(--cyan);filter:blur(75px);opacity:.4}
.hero-label{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:2.5px}
.hero h1{font-size:29px;line-height:1.12;letter-spacing:-1.2px;margin:10px 0}
.hero h1 span{color:var(--gold);text-shadow:0 0 20px #ffd76a44}
.hero p{font-size:12px;line-height:1.6;color:#c7c0e0;max-width:270px;margin:0}
.hero-art{position:absolute;right:17px;top:38px;font-size:65px;filter:drop-shadow(0 0 20px #a855f766);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(5deg)}}
@keyframes pop{0%{transform:scale(.75);opacity:.2}75%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
.balance-card{margin-top:16px;padding:17px;border-radius:21px;background:linear-gradient(120deg,#1b1833,#141125);border:1px solid var(--border)}
.balance-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--muted);font-weight:800}
.balance{font-size:32px;font-weight:950;letter-spacing:-1px;margin-top:3px}
.balance small{font-size:12px;color:var(--cyan);letter-spacing:1px}
.level-chip{border:1px solid #a855f766;background:#8c39ff1a;border-radius:12px;padding:8px 10px;text-align:center;min-width:68px}
.level-chip b{display:block;color:#d7a8ff;font-size:17px}
.level-chip span{font-size:9px;color:var(--muted);letter-spacing:1px}
.xp-line{height:5px;border-radius:10px;background:#ffffff10;overflow:hidden;margin-top:13px}
.xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s}
.xp-caption{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0 24px}
.stat{background:#131023;border:1px solid var(--border);border-radius:15px;padding:12px 10px}
.stat-icon{font-size:17px}.stat-num{font-weight:900;font-size:18px;margin-top:5px}.stat-label{font-size:10px;color:var(--muted);margin-top:2px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px}
.section-head h2{font-size:17px;margin:0;letter-spacing:-.4px}
.section-head p{font-size:10px;color:var(--muted);margin:4px 0 0}
.section-tag{font-size:9px;color:var(--cyan);border:1px solid #35eaff40;padding:5px 8px;border-radius:8px;letter-spacing:1px}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game{
 position:relative;text-align:left;padding:14px;min-height:144px;overflow:hidden;width:100%;
 border:1px solid var(--border);border-radius:19px;background:linear-gradient(145deg,#1d1934,#121020);
 transition:transform .15s,border-color .15s
}
.game:active{transform:scale(.97)}
.game.selected{border-color:var(--cyan);box-shadow:inset 0 0 24px #35eaff0c}
.game:before{content:"";position:absolute;width:95px;height:95px;right:-42px;top:-42px;border-radius:50%;background:var(--glow,#a855f7);filter:blur(40px);opacity:.3}
.game-icon{font-size:33px;display:block;margin-bottom:13px;filter:drop-shadow(0 0 12px #a855f744)}
.game-name{font-size:13px;font-weight:900}
.game-desc{font-size:10px;color:var(--muted);margin-top:4px}
.game-cost{position:absolute;right:11px;top:11px;font-size:9px;color:var(--gold);background:#ffd76a12;border:1px solid #ffd76a30;padding:4px 6px;border-radius:7px}
.play-panel{margin-top:19px;border:1px solid #6d4b9e7a;border-radius:23px;background:linear-gradient(145deg,#1b1630,#10101f);padding:17px;min-height:270px;box-shadow:0 10px 35px #0003}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-title{font-weight:900;font-size:16px}
.panel-sub{font-size:10px;color:var(--muted);margin-top:3px}
.live-dot{font-size:9px;color:var(--green);letter-spacing:1px;display:flex;align-items:center;gap:5px}
.live-dot:before{content:"";width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block}
.stage{
 min-height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;
 text-align:center;padding:18px 5px;gap:10px;position:relative
}
.stage-emoji{font-size:52px;filter:drop-shadow(0 0 20px #a855f755)}
.stage-message{font-size:12px;color:#c5bddf;line-height:1.5;margin:5px 0}
.stage-message strong{color:var(--gold)}
.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:12px}
.stake-btn{background:#ffffff07;border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:11px;font-weight:800;min-width:42px;transition:all 0.2s}
.stake-btn.active{color:var(--cyan);border-color:var(--cyan);background:#35eaff12}
.primary{
 width:100%;border:0;border-radius:13px;padding:13px 15px;font-size:12px;font-weight:950;
 color:#10091b;background:linear-gradient(100deg,#b37aff,#55eaff);box-shadow:0 5px 20px #8e48ff20;
 transition:transform .15s
}
.primary:active{transform:scale(.985)}
.panel-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
.mines{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:240px;margin:5px auto}
.mine-cell{aspect-ratio:1;border-radius:10px;border:1px solid #7253a0;background:linear-gradient(145deg,#30234d,#1a1730);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0;transition:all 0.2s}
.mine-cell.open{background:#183d43;border-color:var(--green)}
.mine-cell.bomb{background:#4b183c;border-color:var(--pink)}
.wheel-container{position:relative;width:130px;height:130px;margin:5px auto;display:flex;align-items:center;justify-content:center}
.wheel{
  width:100%;height:100%;border-radius:50%;
  border:5px solid #2b1f4c;
  background:conic-gradient(var(--purple) 0deg 90deg, var(--panel2) 90deg 180deg, var(--cyan) 180deg 270deg, var(--pink) 270deg 360deg);
  transition:transform 3s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow:0 0 20px rgba(0,0,0,0.5)
}
.wheel-pointer{position:absolute;top:-8px;font-size:20px;z-index:2;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.5))}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">💎</div>
      <div>
        <div class="brand-name">Gram<span>Jeckpot</span></div>
        <div class="brand-sub">ARCADE EDITION</div>
      </div>
    </div>
    <button class="icon-btn" onclick="addDailyBonus()">🎁</button>
  </div>

  <div class="hero">
    <div class="hero-label">RETRO FUTURE</div>
    <h1>Удача любит <span>Смелых</span></h1>
    <p>Выбирай аркаду, настраивай ставку и забирай джекпот прямо сейчас!</p>
    <div class="hero-art">🕹️</div>
  </div>

  <div class="balance-card">
    <div class="balance-top">
      <div>
        <div class="eyebrow">ТВОЙ БАЛАНС</div>
        <div class="balance" id="user-balance">1000 <small>GRAM</small></div>
      </div>
      <div class="level-chip">
        <b id="user-lvl">1</b>
        <span>УРОВЕНЬ</span>
      </div>
    </div>
    <div class="xp-line"><div class="xp-fill" id="xp-bar"></div></div>
    <div class="xp-caption">
      <span id="xp-text">0 / 100 XP</span>
      <span>ДО СЛЕДУЮЩЕГО</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-icon">🔥</div>
      <div class="stat-num" id="stat-games">0</div>
      <div class="stat-label">Всего игр</div>
    </div>
    <div class="stat">
      <div class="stat-icon">🏆</div>
